# Builds the web app (Web/) and, from main, deploys it to Cloudflare at
# tables.atelier.ktgk.app. Pull requests are built and tested but not deployed.
#
# Needs two repository secrets:
#   CLOUDFLARE_API_TOKEN   a token with "Workers Scripts: Edit" on the account and
#                          "Workers Routes: Edit" and "DNS: Edit" on the ktgk.app zone
#   CLOUDFLARE_ACCOUNT_ID  the account that holds the ktgk.app zone

name: Web

on:
  push:
    branches: [main]
    paths: ["Web/**", "Engine/**", ".github/workflows/web.yml"]
  pull_request:
    paths: ["Web/**", "Engine/**", ".github/workflows/web.yml"]
  workflow_dispatch:

concurrency:
  group: web-${{ github.ref }}
  cancel-in-progress: true

env:
  # The toolchain and its Swift SDK for WebAssembly must be the same version.
  SWIFT_VERSION: "6.4.2"
  SWIFT_WASM_SDK_CHECKSUM: "83baca83553f8c443cda7b84800912e6e709c3acd2e7ebf277794ca5836c0da5"

jobs:
  build:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Install Swift
        run: |
          sudo apt-get update -q
          sudo apt-get install -yq --no-install-recommends binutils libcurl4-openssl-dev libedit2 libncurses-dev libxml2-dev libz3-dev zlib1g-dev
          name="swift-${SWIFT_VERSION}-RELEASE-ubuntu24.04"
          curl -fsSL "https://download.swift.org/swift-${SWIFT_VERSION}-release/ubuntu2404/swift-${SWIFT_VERSION}-RELEASE/${name}.tar.gz" | tar -xz -C "$RUNNER_TEMP"
          echo "SWIFT_TOOLCHAIN=$RUNNER_TEMP/$name" >> "$GITHUB_ENV"
          "$RUNNER_TEMP/$name/usr/bin/swift" --version

      - name: Install the Swift SDK for WebAssembly
        run: |
          "$SWIFT_TOOLCHAIN/usr/bin/swift" sdk install \
            "https://download.swift.org/swift-${SWIFT_VERSION}-release/wasm-sdk/swift-${SWIFT_VERSION}-RELEASE/swift-${SWIFT_VERSION}-RELEASE_wasm.artifactbundle.tar.gz" \
            --checksum "$SWIFT_WASM_SDK_CHECKSUM"
          echo "SWIFT_SDK=swift-${SWIFT_VERSION}-RELEASE_wasm" >> "$GITHUB_ENV"

      - name: Build
        run: Web/build.sh

      - name: Test
        run: node Web/wasm/tests/smoke.mjs

      - name: Check the design rules
        run: node Web/design/lint.mjs

      - uses: actions/upload-artifact@v4
        with:
          name: site
          path: Web/dist
          include-hidden-files: true
          retention-days: 7

  deploy:
    needs: build
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    environment:
      name: production
      url: https://tables.atelier.ktgk.app
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: Web/wrangler.jsonc
          sparse-checkout-cone-mode: false

      - uses: actions/download-artifact@v4
        with:
          name: site
          path: Web/dist

      - name: Deploy to Cloudflare
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: Web
          command: deploy
